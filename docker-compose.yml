# PersonalCopilot 生产编排：backend（FastAPI）+ frontend（nginx 反代）
# 使用：在服务器上 cp .env.production .env 填好后，docker compose up -d --build
services:
  backend:
    build: ./backend
    container_name: copilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 数据目录指向持久化卷（与本地 data/ 解耦）
      DATA_DIR: /app/data
      # 前端经 nginx 反代，这里填的是前端对外地址；留空表示不校验 CORS（同源）
      # CORS_ORIGINS 由 .env 传入
    volumes:
      - copilot_data:/app/data
    # 健康检查：探活接口（鉴权中间件已放行 /health）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 不对外暴露 8000，只允许 frontend 容器访问（网络隔离，更安全）
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: copilot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  copilot_data:
