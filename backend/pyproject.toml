[project]
name = "personal-copilot"
version = "0.1.0"
description = "用真实账单场景学习 Agent 工程问题的实验框架（工具调用 / HITL / 幂等 / 上下文治理）"
requires-python = ">=3.12"
license = "Apache-2.0"
# 与 requirements.txt 保持同步（本文件用于元数据与工具链，requirements.txt 用于 venv 安装）
dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "openpyxl>=3.1,<4",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "openai>=1.60,<3",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Windows 上 tmp_path 默认落在系统 Temp，常因权限不足报 PermissionError(WinError 5)，
# 固定到仓库内的 .pytest-tmp 规避；该目录已在 .gitignore 中。
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
